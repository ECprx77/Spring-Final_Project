<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 mb-6">Panier</h1>
      <div th:if="${cart == null or cart.items == null or cart.items.isEmpty()}" class="py-12 text-slate-400 rounded-xl bg-dark-800/60 border border-dark-600/40 p-8 text-center">
        Votre panier est vide. <a th:href="@{/app/shop}" class="text-accent-400 hover:text-accent-300 font-medium">Voir le catalogue</a>.
      </div>
      <div th:if="${cart != null and cart.items != null and !cart.items.isEmpty()}">
        <ul class="divide-y divide-dark-600 border border-dark-600/40 rounded-xl overflow-hidden bg-dark-800/60">
          <li th:each="item : ${cart.items}" class="p-4 sm:p-5 flex flex-wrap items-center justify-between gap-2">
            <div>
              <span class="font-medium text-slate-100" th:text="${item.productName}">Produit</span>
              <span class="text-slate-400 text-sm ml-2" th:text="${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT') + ' € / u.'}">0,00 €</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm text-slate-400">Qté : <span th:text="${item.quantity}">1</span></span>
              <span class="font-semibold text-accent-400" th:text="${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT') + ' €'}">0,00 €</span>
              <form th:action="@{/app/shop/cart/remove/{id}(id=${item.productId})}" method="post" class="inline" onsubmit="return confirm('Retirer cet article du panier ?');">
                <button type="submit" class="text-sm text-red-400 hover:text-red-300 cursor-pointer transition-colors" aria-label="Retirer du panier">Retirer</button>
              </form>
            </div>
          </li>
        </ul>
        <div class="mt-6 flex flex-wrap justify-between items-center gap-4">
          <a th:href="@{/app/shop}" class="text-accent-400 hover:text-accent-300 transition-colors">Continuer mes achats</a>
          <div class="text-right">
            <span class="text-slate-400">Total : </span>
            <span class="text-xl font-bold text-accent-400" th:text="${cart.total != null ? #numbers.formatDecimal(cart.total, 1, 'COMMA', 2, 'POINT') + ' €' : '0,00 €'}">0,00 €</span>
          </div>
        </div>
        <div class="mt-6">
          <a th:href="@{/app/shop/checkout}" class="inline-block px-6 py-3 bg-accent-600 text-white font-medium rounded-lg hover:bg-accent-500 transition-colors duration-200">Passer la commande</a>
        </div>
      </div>
    </div>
  </th:block>
</body>
</html>
