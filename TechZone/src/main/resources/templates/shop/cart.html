<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-3xl mx-auto">
      <h1 class="text-2xl font-bold text-neutral-900 mb-6">Panier</h1>
      <div th:if="${cart == null or cart.items == null or cart.items.isEmpty()}" class="py-8 text-neutral-600">
        Votre panier est vide. <a th:href="@{/app/shop}" class="text-brand-600 hover:text-brand-700">Voir le catalogue</a>.
      </div>
      <div th:if="${cart != null and cart.items != null and !cart.items.isEmpty()}">
        <ul class="divide-y divide-neutral-200 border border-neutral-200 rounded-lg overflow-hidden">
          <li th:each="item : ${cart.items}" class="p-4 flex flex-wrap items-center justify-between gap-2 bg-white">
            <div>
              <span class="font-medium text-neutral-900" th:text="${item.productName}">Produit</span>
              <span class="text-neutral-600 text-sm ml-2" th:text="${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT') + ' € / u.'}">0,00 €</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm text-neutral-600">Qté : <span th:text="${item.quantity}">1</span></span>
              <span class="font-semibold" th:text="${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT') + ' €'}">0,00 €</span>
              <form th:action="@{/app/shop/cart/remove/{id}(id=${item.productId})}" method="post" class="inline" onsubmit="return confirm('Retirer cet article du panier ?');">
                <button type="submit" class="text-sm text-red-600 hover:text-red-700 cursor-pointer" aria-label="Retirer du panier">Retirer</button>
              </form>
            </div>
          </li>
        </ul>
        <div class="mt-6 flex justify-between items-center">
          <a th:href="@{/app/shop}" class="text-brand-600 hover:text-brand-700">Continuer mes achats</a>
          <div class="text-right">
            <span class="text-lg font-semibold text-neutral-900">Total : </span>
            <span class="text-xl font-bold text-brand-600" th:text="${cart.total != null ? #numbers.formatDecimal(cart.total, 1, 'COMMA', 2, 'POINT') + ' €' : '0,00 €'}">0,00 €</span>
          </div>
        </div>
        <div class="mt-6">
          <a th:href="@{/app/shop/checkout}" class="inline-block px-6 py-3 bg-brand-600 text-white font-medium rounded-lg hover:bg-brand-700 transition">Passer la commande</a>
        </div>
      </div>
    </div>
  </th:block>
</body>
</html>
