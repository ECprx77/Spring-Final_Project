<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-2xl mx-auto">
      <h1 class="text-2xl font-bold text-neutral-900 mb-6">Récapitulatif de la commande</h1>
      <ul class="divide-y divide-neutral-200 border border-neutral-200 rounded-lg overflow-hidden mb-6">
        <li th:each="item : ${cart.items}" class="p-4 flex justify-between bg-white">
          <span class="font-medium" th:text="${item.productName}">Produit</span>
          <span th:text="${item.quantity} + ' × ' + ${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')} + ' € = ' + ${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</span>
        </li>
      </ul>
      <div class="flex justify-between text-lg font-semibold mb-8">
        <span>Total</span>
        <span class="text-brand-600" th:text="${cart.total != null ? #numbers.formatDecimal(cart.total, 1, 'COMMA', 2, 'POINT') + ' €' : '0,00 €'}">0,00 €</span>
      </div>
      <form th:action="@{/app/shop/checkout}" method="post">
        <button type="submit" class="w-full py-3 bg-brand-600 text-white font-medium rounded-lg hover:bg-brand-700 transition">Confirmer la commande</button>
      </form>
      <a th:href="@{/app/shop/cart}" class="block mt-4 text-center text-sm text-neutral-600 hover:text-neutral-900">Retour au panier</a>
    </div>
  </th:block>
</body>
</html>
