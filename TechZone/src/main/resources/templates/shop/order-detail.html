<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <a th:href="@{/app/shop/orders}" class="text-sm text-accent-400 hover:text-accent-300 mb-4 inline-block transition-colors">← Retour aux commandes</a>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 mb-6" th:text="'Commande #' + ${order.id}">Commande #1</h1>
      <div class="bg-dark-800/60 border border-dark-600/40 rounded-xl overflow-hidden">
        <div class="p-4 border-b border-dark-600 flex justify-between items-center">
          <span class="text-slate-400" th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">Date</span>
          <span class="font-medium" th:classappend="${order.status == 'CANCELLED'} ? 'text-red-400' : 'text-slate-100'" th:text="${order.status}">PENDING</span>
        </div>
        <ul class="divide-y divide-dark-600">
          <li th:each="line : ${order.orderLines}" class="p-4 flex justify-between text-slate-100">
            <span th:text="${line.product != null ? line.product.name : 'Produit'}">Produit</span>
            <span class="text-slate-400" th:text="${line.quantity} + ' × ' + ${#numbers.formatDecimal(line.unitPrice, 1, 'COMMA', 2, 'POINT')} + ' € = ' + ${#numbers.formatDecimal(line.lineTotal, 1, 'COMMA', 2, 'POINT')} + ' €'">0,00 €</span>
          </li>
        </ul>
        <div class="p-4 border-t border-dark-600 flex justify-between font-semibold text-lg text-slate-100">
          <span>Total</span>
          <span class="text-accent-400" th:text="${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT') + ' €'}">0,00 €</span>
        </div>
      </div>
    </div>
  </th:block>
</body>
</html>
