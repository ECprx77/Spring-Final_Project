<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="header" class="bg-white border-b border-neutral-200 sticky top-0 z-10">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-14 sm:h-16 items-center">
        <a th:href="@{/app/}" class="text-lg sm:text-xl font-semibold text-brand-600 hover:text-brand-700 transition">TechZone</a>
        <button type="button" id="menu-toggle" class="md:hidden p-2 rounded-lg text-neutral-600 hover:bg-neutral-100" aria-expanded="false" aria-label="Ouvrir le menu" aria-controls="nav-menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div id="nav-menu" class="hidden md:flex flex flex-col md:flex-row md:items-center gap-1 md:gap-3 lg:gap-6 text-sm pb-4 md:pb-0 border-t md:border-t-0 border-neutral-100 mt-2 md:mt-0 pt-2 md:pt-0" role="navigation">
          <th:block th:if="${user != null}">
            <a th:href="@{/app/shop}" class="block py-2 md:py-0 text-neutral-600 hover:text-neutral-900 transition">Catalogue</a>
            <a th:href="@{/app/shop/cart}" class="block py-2 md:py-0 text-neutral-600 hover:text-neutral-900 transition" aria-label="Panier">Panier</a>
            <a th:href="@{/app/shop/orders}" class="block py-2 md:py-0 text-neutral-600 hover:text-neutral-900 transition">Commandes</a>
            <th:block th:if="${isAdmin}">
              <a th:href="@{/app/admin}" class="block py-2 md:py-0 text-brand-600 hover:text-brand-700 font-medium transition">Admin</a>
            </th:block>
            <span class="block py-2 md:py-0 text-neutral-500" th:text="${user.fullName}">User</span>
            <a th:href="@{/app/logout}" class="block py-2 md:py-0 text-neutral-500 hover:text-red-600 transition">Déconnexion</a>
          </th:block>
          <th:block th:if="${user == null}">
            <a th:href="@{/app/shop}" class="block py-2 md:py-0 text-neutral-600 hover:text-neutral-900 transition">Catalogue</a>
            <a th:href="@{/app/login}" class="block py-2 md:py-0 text-brand-600 hover:text-brand-700 font-medium transition">Connexion</a>
            <a th:href="@{/app/register}" class="block py-2 md:py-0 px-3 py-1.5 rounded-lg border border-neutral-300 text-neutral-700 hover:bg-neutral-50 transition">Inscription</a>
          </th:block>
        </div>
      </div>
    </nav>
    <script th:inline="javascript">
      (function() {
        var toggle = document.getElementById('menu-toggle');
        var menu = document.getElementById('nav-menu');
        if (toggle && menu) {
          toggle.addEventListener('click', function() {
            var isHidden = menu.classList.contains('hidden');
            menu.classList.toggle('hidden', !isHidden);
            toggle.setAttribute('aria-expanded', isHidden);
            toggle.setAttribute('aria-label', isHidden ? 'Fermer le menu' : 'Ouvrir le menu');
          });
        }
      })();
    </script>
  </header>
</body>
</html>
