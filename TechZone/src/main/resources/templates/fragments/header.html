<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="header" class="bg-white border-b border-neutral-200 sticky top-0 z-10">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-14 sm:h-16 items-center">
        <a th:href="@{/app/}" class="text-lg sm:text-xl font-semibold text-brand-600 hover:text-brand-700 transition">TechZone</a>
        <div class="flex items-center gap-3 sm:gap-6 text-sm">
          <th:block th:if="${user != null}">
            <a th:href="@{/app/shop}" class="text-neutral-600 hover:text-neutral-900 transition">Catalogue</a>
            <a th:href="@{/app/shop/cart}" class="text-neutral-600 hover:text-neutral-900 transition">Panier</a>
            <a th:href="@{/app/shop/orders}" class="text-neutral-600 hover:text-neutral-900 transition">Commandes</a>
            <th:block th:if="${isAdmin}">
              <a th:href="@{/app/admin}" class="text-brand-600 hover:text-brand-700 font-medium transition">Admin</a>
            </th:block>
            <span class="text-neutral-500 hidden sm:inline" th:text="${user.fullName}">User</span>
            <a th:href="@{/app/logout}" class="text-neutral-500 hover:text-red-600 transition">Déconnexion</a>
          </th:block>
          <th:block th:if="${user == null}">
            <a th:href="@{/app/shop}" class="text-neutral-600 hover:text-neutral-900 transition">Catalogue</a>
            <a th:href="@{/app/login}" class="text-brand-600 hover:text-brand-700 font-medium transition">Connexion</a>
            <a th:href="@{/app/register}" class="px-3 py-1.5 rounded-lg border border-neutral-300 text-neutral-700 hover:bg-neutral-50 transition">Inscription</a>
          </th:block>
        </div>
      </div>
    </nav>
  </header>
</body>
</html>
