<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header th:fragment="header" class="sticky top-0 z-50 bg-dark-900/95 backdrop-blur-sm border-b border-dark-600/50 transition-all duration-300">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 sm:h-18 items-center">
        <a th:href="@{/app/}" class="text-xl font-semibold text-slate-100 hover:text-accent-400 transition-colors duration-200 tracking-tight">TechZone</a>
        <button type="button" id="menu-toggle" class="md:hidden p-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-dark-600 transition-colors" aria-expanded="false" aria-label="Ouvrir le menu" aria-controls="nav-menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div id="nav-menu" class="hidden md:flex flex-col md:flex-row md:items-center gap-1 md:gap-2 lg:gap-8 text-sm pb-4 md:pb-0 border-t md:border-t-0 border-dark-600/50 mt-2 md:mt-0 pt-4 md:pt-0" role="navigation">
          <th:block th:if="${user != null}">
            <a th:href="@{/app/shop}" class="block py-2 md:py-0 text-slate-400 hover:text-accent-400 transition-colors duration-200">Catalogue</a>
            <a th:href="@{/app/shop/cart}" class="block py-2 md:py-0 text-slate-400 hover:text-accent-400 transition-colors duration-200" aria-label="Panier">Panier</a>
            <a th:href="@{/app/shop/orders}" class="block py-2 md:py-0 text-slate-400 hover:text-accent-400 transition-colors duration-200">Commandes</a>
            <th:block th:if="${isAdmin}">
              <a th:href="@{/app/admin}" class="block py-2 md:py-0 text-accent-400 font-medium hover:text-accent-300 transition-colors">Admin</a>
            </th:block>
            <span class="block py-2 md:py-0 text-slate-500" th:text="${user.fullName}">User</span>
            <a th:href="@{/app/logout}" class="block py-2 md:py-0 text-slate-500 hover:text-red-400 transition-colors duration-200">Déconnexion</a>
          </th:block>
          <th:block th:if="${user == null}">
            <a th:href="@{/app/shop}" class="block py-2 md:py-0 text-slate-400 hover:text-accent-400 transition-colors duration-200">Catalogue</a>
            <a th:href="@{/app/login}" class="block py-2 md:py-0 text-accent-400 font-medium hover:text-accent-300 transition-colors">Connexion</a>
            <a th:href="@{/app/register}" class="block py-2 md:py-0 px-4 py-2 rounded-lg border border-slate-500/60 text-slate-200 hover:bg-dark-600 hover:border-accent-500/50 transition-all duration-200">Inscription</a>
          </th:block>
        </div>
      </div>
    </nav>
    <script th:inline="javascript">
      (function() {
        var toggle = document.getElementById('menu-toggle');
        var menu = document.getElementById('nav-menu');
        if (toggle && menu) {
          toggle.addEventListener('click', function() {
            var isHidden = menu.classList.contains('hidden');
            menu.classList.toggle('hidden', !isHidden);
            toggle.setAttribute('aria-expanded', isHidden);
            toggle.setAttribute('aria-label', isHidden ? 'Fermer le menu' : 'Ouvrir le menu');
          });
        }
      })();
    </script>
  </header>
</body>
</html>
