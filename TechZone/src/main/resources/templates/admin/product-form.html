<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-2xl mx-auto">
      <h1 class="text-2xl font-bold text-neutral-900 mb-6" th:text="${pageTitle}">Produit</h1>
      <p th:if="${message}" class="mb-4 p-3 bg-red-50 text-red-800 rounded-lg text-sm" th:text="${message}"></p>
      <form th:action="${product.id == null} ? @{/app/admin/products} : @{/app/admin/products/{id}(id=${product.id})}" th:object="${product}" method="post" class="space-y-4">
        <th:block th:if="${product.id != null}">
          <input type="hidden" th:field="*{id}"/>
        </th:block>
        <div>
          <label for="name" class="block text-sm font-medium text-neutral-700 mb-1">Nom</label>
          <input type="text" id="name" th:field="*{name}" required class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500"/>
          <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-sm mt-1"></p>
        </div>
        <div>
          <label for="description" class="block text-sm font-medium text-neutral-700 mb-1">Description</label>
          <textarea id="description" th:field="*{description}" rows="3" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500"></textarea>
        </div>
        <div>
          <label for="price" class="block text-sm font-medium text-neutral-700 mb-1">Prix (€)</label>
          <input type="number" id="price" th:field="*{price}" step="0.01" min="0.01" required class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500"/>
          <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-red-600 text-sm mt-1"></p>
        </div>
        <div>
          <label for="categoryId" class="block text-sm font-medium text-neutral-700 mb-1">Catégorie</label>
          <select id="categoryId" th:field="*{categoryId}" required class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
            <option value="">-- Choisir --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Catégorie</option>
          </select>
          <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-red-600 text-sm mt-1"></p>
        </div>
        <div>
          <label for="status" class="block text-sm font-medium text-neutral-700 mb-1">Statut stock</label>
          <select id="status" th:field="*{status}" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
            <option value="en_stock">En stock</option>
            <option value="en_rupture">Rupture</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="isPromo" th:field="*{isPromo}" class="rounded border-neutral-300 text-brand-600 focus:ring-brand-500"/>
          <label for="isPromo" class="text-sm font-medium text-neutral-700">En promotion</label>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="px-4 py-2 bg-brand-600 text-white font-medium rounded-lg hover:bg-brand-700 transition">Enregistrer</button>
          <a th:href="@{/app/admin/products}" class="px-4 py-2 border border-neutral-300 rounded-lg hover:bg-neutral-50 transition">Annuler</a>
        </div>
      </form>
    </div>
  </th:block>
</body>
</html>
