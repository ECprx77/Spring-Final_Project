<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 mb-6">Journaux d'audit</h1>
      <form th:action="@{/app/admin/audit}" method="get" class="mb-4 flex flex-wrap gap-2 items-center">
        <input type="hidden" name="page" value="0"/>
        <label class="text-sm text-slate-400">Action</label>
        <select name="action" class="px-2 py-1.5 bg-dark-700 border border-dark-600 rounded text-sm text-slate-100">
          <option value="">Toutes</option>
          <option th:each="a : ${auditActions}" th:value="${a.name()}" th:text="${a.name()}" th:selected="${filterAction == a.name()}"></option>
        </select>
        <label class="text-sm text-slate-400 ml-2">Type</label>
        <select name="entityType" class="px-2 py-1.5 bg-dark-700 border border-dark-600 rounded text-sm text-slate-100">
          <option value="">Tous</option>
          <option th:each="e : ${auditEntities}" th:value="${e.name()}" th:text="${e.name()}" th:selected="${filterEntityType == e.name()}"></option>
        </select>
        <button type="submit" class="px-3 py-1.5 bg-accent-600 text-white rounded text-sm hover:bg-accent-500 transition-colors">Filtrer</button>
      </form>
      <div class="bg-dark-800/60 border border-dark-600/40 rounded-xl overflow-hidden overflow-x-auto">
        <table class="min-w-full divide-y divide-dark-600">
          <thead class="bg-dark-700/60">
            <tr>
              <th class="px-4 py-3 text-left text-sm font-semibold text-slate-200">Date</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-slate-200">Action</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-slate-200">Type</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-slate-200">ID entité</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-slate-200">Utilisateur</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-slate-200">IP</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-dark-600">
            <tr th:each="log : ${auditPage.content}" class="hover:bg-dark-700/40 transition-colors">
              <td class="px-4 py-3 text-sm text-slate-400" th:text="${log.createdAt != null ? #temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm:ss') : '-'}">-</td>
              <td class="px-4 py-3 text-sm font-medium text-slate-100" th:text="${log.action}">-</td>
              <td class="px-4 py-3 text-sm text-slate-400" th:text="${log.entityType}">-</td>
              <td class="px-4 py-3 text-sm text-slate-400" th:text="${log.entityId != null ? log.entityId : '-'}">-</td>
              <td class="px-4 py-3 text-sm text-slate-400" th:text="${log.user != null ? log.user.email : (log.payload != null ? log.payload : '-')}">-</td>
              <td class="px-4 py-3 text-sm text-slate-500" th:text="${log.ipAddress != null ? log.ipAddress : '-'}">-</td>
            </tr>
          </tbody>
        </table>
      </div>
      <nav th:if="${auditPage.totalPages > 1}" class="mt-4 flex justify-center gap-2">
        <a th:if="${auditPage.hasPrevious()}" th:href="@{/app/admin/audit(page=${auditPage.number - 1}, size=${auditPage.size}, action=${filterAction}, entityType=${filterEntityType})}" class="px-4 py-2 border border-dark-600 rounded-lg text-slate-400 hover:bg-dark-600 hover:text-slate-100 transition-colors">Préc.</a>
        <span class="px-4 py-2 text-slate-500" th:text="'Page ' + (auditPage.number + 1) + ' / ' + auditPage.totalPages">Page 1 / 1</span>
        <a th:if="${auditPage.hasNext()}" th:href="@{/app/admin/audit(page=${auditPage.number + 1}, size=${auditPage.size}, action=${filterAction}, entityType=${filterEntityType})}" class="px-4 py-2 border border-dark-600 rounded-lg text-slate-400 hover:bg-dark-600 hover:text-slate-100 transition-colors">Suiv.</a>
      </nav>
    </div>
  </th:block>
</body>
</html>
