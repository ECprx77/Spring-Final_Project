<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-2xl font-bold text-neutral-900 mb-6">Journaux d'audit</h1>
      <form th:action="@{/app/admin/audit}" method="get" class="mb-4 flex flex-wrap gap-2 items-center">
        <input type="hidden" name="page" value="0"/>
        <label class="text-sm text-neutral-600">Action</label>
        <select name="action" class="px-2 py-1 border border-neutral-300 rounded text-sm">
          <option value="">Toutes</option>
          <option th:each="a : ${auditActions}" th:value="${a.name()}" th:text="${a.name()}" th:selected="${filterAction == a.name()}"></option>
        </select>
        <label class="text-sm text-neutral-600 ml-2">Type</label>
        <select name="entityType" class="px-2 py-1 border border-neutral-300 rounded text-sm">
          <option value="">Tous</option>
          <option th:each="e : ${auditEntities}" th:value="${e.name()}" th:text="${e.name()}" th:selected="${filterEntityType == e.name()}"></option>
        </select>
        <button type="submit" class="px-3 py-1 bg-brand-600 text-white rounded text-sm hover:bg-brand-700">Filtrer</button>
      </form>
      <div class="bg-white border border-neutral-200 rounded-lg overflow-hidden overflow-x-auto">
        <table class="min-w-full divide-y divide-neutral-200">
          <thead class="bg-neutral-50">
            <tr>
              <th class="px-4 py-2 text-left text-sm font-semibold text-neutral-900">Date</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-neutral-900">Action</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-neutral-900">Type</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-neutral-900">ID entité</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-neutral-900">Utilisateur</th>
              <th class="px-4 py-2 text-left text-sm font-semibold text-neutral-900">IP</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-neutral-200">
            <tr th:each="log : ${auditPage.content}" class="bg-white">
              <td class="px-4 py-2 text-sm text-neutral-600" th:text="${log.createdAt != null ? #temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm:ss') : '-'}">-</td>
              <td class="px-4 py-2 text-sm font-medium" th:text="${log.action}">-</td>
              <td class="px-4 py-2 text-sm text-neutral-600" th:text="${log.entityType}">-</td>
              <td class="px-4 py-2 text-sm text-neutral-600" th:text="${log.entityId != null ? log.entityId : '-'}">-</td>
              <td class="px-4 py-2 text-sm text-neutral-600" th:text="${log.user != null ? log.user.email : (log.payload != null ? log.payload : '-')}">-</td>
              <td class="px-4 py-2 text-sm text-neutral-500" th:text="${log.ipAddress != null ? log.ipAddress : '-'}">-</td>
            </tr>
          </tbody>
        </table>
      </div>
      <nav th:if="${auditPage.totalPages > 1}" class="mt-4 flex justify-center gap-2">
        <a th:if="${auditPage.hasPrevious()}" th:href="@{/app/admin/audit(page=${auditPage.number - 1}, size=${auditPage.size}, action=${filterAction}, entityType=${filterEntityType})}" class="px-3 py-1 border border-neutral-300 rounded hover:bg-neutral-100">Préc.</a>
        <span class="px-3 py-1 text-neutral-600" th:text="'Page ' + (auditPage.number + 1) + ' / ' + auditPage.totalPages">Page 1 / 1</span>
        <a th:if="${auditPage.hasNext()}" th:href="@{/app/admin/audit(page=${auditPage.number + 1}, size=${auditPage.size}, action=${filterAction}, entityType=${filterEntityType})}" class="px-3 py-1 border border-neutral-300 rounded hover:bg-neutral-100">Suiv.</a>
      </nav>
    </div>
  </th:block>
</body>
</html>
