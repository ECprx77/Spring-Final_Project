<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-xl mx-auto">
      <h1 class="text-2xl font-bold text-neutral-900 mb-6" th:text="${pageTitle}">Catégorie</h1>
      <p th:if="${message}" class="mb-4 p-3 bg-red-50 text-red-800 rounded-lg text-sm" th:text="${message}"></p>
      <form th:action="${category.id == null} ? @{/app/admin/categories} : @{/app/admin/categories/{id}(id=${category.id})}" th:object="${category}" method="post" class="space-y-4">
        <th:block th:if="${category.id != null}">
          <input type="hidden" th:field="*{id}"/>
        </th:block>
        <div>
          <label for="name" class="block text-sm font-medium text-neutral-700 mb-1">Nom</label>
          <input type="text" id="name" th:field="*{name}" required class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500"/>
          <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-sm mt-1"></p>
        </div>
        <div>
          <label for="description" class="block text-sm font-medium text-neutral-700 mb-1">Description</label>
          <textarea id="description" th:field="*{description}" rows="2" class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500"></textarea>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="px-4 py-2 bg-brand-600 text-white font-medium rounded-lg hover:bg-brand-700 transition">Enregistrer</button>
          <a th:href="@{/app/admin/categories}" class="px-4 py-2 border border-neutral-300 rounded-lg hover:bg-neutral-50 transition">Annuler</a>
        </div>
      </form>
    </div>
  </th:block>
</body>
</html>
