<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 mb-6" th:text="${pageTitle}">Catégorie</h1>
      <p th:if="${message}" class="mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-300 rounded-lg text-sm" th:text="${message}"></p>
      <form th:action="${category.id == null} ? @{/app/admin/categories} : @{/app/admin/categories/{id}(id=${category.id})}" th:object="${category}" method="post" class="space-y-4">
        <th:block th:if="${category.id != null}">
          <input type="hidden" th:field="*{id}"/>
        </th:block>
        <div>
          <label for="name" class="block text-sm font-medium text-slate-300 mb-1">Nom</label>
          <input type="text" id="name" th:field="*{name}" required class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-lg text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-accent-500 focus:border-accent-500"/>
          <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-400 text-sm mt-1"></p>
        </div>
        <div>
          <label for="description" class="block text-sm font-medium text-slate-300 mb-1">Description</label>
          <textarea id="description" th:field="*{description}" rows="2" class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-lg text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-accent-500 focus:border-accent-500"></textarea>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="px-4 py-2 bg-accent-600 text-white font-medium rounded-lg hover:bg-accent-500 transition-colors">Enregistrer</button>
          <a th:href="@{/app/admin/categories}" class="px-4 py-2 border border-dark-600 rounded-lg text-slate-400 hover:bg-dark-600 hover:text-slate-100 transition-colors">Annuler</a>
        </div>
      </form>
    </div>
  </th:block>
</body>
</html>
