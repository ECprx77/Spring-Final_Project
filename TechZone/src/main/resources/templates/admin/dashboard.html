<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 mb-6">Administration TechZone</h1>
      <nav class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <a th:href="@{/app/admin/products}" class="block p-6 bg-dark-800/60 border border-dark-600/40 rounded-xl hover:border-accent-500/30 transition-all duration-300 text-center">
          <span class="text-3xl block mb-2">📦</span>
          <span class="font-semibold text-slate-100">Produits</span>
          <p class="text-sm text-slate-400 mt-1">Gérer le catalogue</p>
        </a>
        <a th:href="@{/app/admin/categories}" class="block p-6 bg-dark-800/60 border border-dark-600/40 rounded-xl hover:border-accent-500/30 transition-all duration-300 text-center">
          <span class="text-3xl block mb-2">📁</span>
          <span class="font-semibold text-slate-100">Catégories</span>
          <p class="text-sm text-slate-400 mt-1">Gérer les catégories</p>
        </a>
        <a th:href="@{/app/admin/orders}" class="block p-6 bg-dark-800/60 border border-dark-600/40 rounded-xl hover:border-accent-500/30 transition-all duration-300 text-center">
          <span class="text-3xl block mb-2">📋</span>
          <span class="font-semibold text-slate-100">Commandes</span>
          <p class="text-sm text-slate-400 mt-1">Voir et mettre à jour les commandes</p>
        </a>
        <a th:href="@{/app/admin/audit}" class="block p-6 bg-dark-800/60 border border-dark-600/40 rounded-xl hover:border-accent-500/30 transition-all duration-300 text-center">
          <span class="text-3xl block mb-2">📜</span>
          <span class="font-semibold text-slate-100">Journaux d'audit</span>
          <p class="text-sm text-slate-400 mt-1">Connexions et commandes</p>
        </a>
      </nav>
    </div>
  </th:block>
</body>
</html>
