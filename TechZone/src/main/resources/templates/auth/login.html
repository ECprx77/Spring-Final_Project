<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 mb-6">Connexion</h1>
      <p th:if="${loginError}" class="mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-300 rounded-lg text-sm" th:text="${loginError}"></p>
      <p th:if="${registerSuccess}" class="mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 rounded-lg text-sm" th:text="${registerSuccess}"></p>
      <form th:action="@{/app/login}" th:object="${loginRequest}" method="post" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Email</label>
          <input type="email" id="email" th:field="*{email}" required
                 class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-lg text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-accent-500 focus:border-accent-500"/>
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-400 text-sm mt-1"></p>
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Mot de passe</label>
          <input type="password" id="password" th:field="*{password}" required
                 class="w-full px-3 py-2 bg-dark-700 border border-dark-600 rounded-lg text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-accent-500 focus:border-accent-500"/>
          <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-400 text-sm mt-1"></p>
        </div>
        <button type="submit" class="w-full py-3 px-4 bg-accent-600 text-white font-medium rounded-lg hover:bg-accent-500 transition-colors duration-200">
          Se connecter
        </button>
      </form>
      <p class="mt-4 text-sm text-slate-400">
        Pas de compte ? <a th:href="@{/app/register}" class="text-accent-400 hover:text-accent-300 font-medium">S'inscrire</a>
      </p>
    </div>
  </th:block>
</body>
</html>
