<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(~{::main})}">
<body>
  <th:block th:fragment="main">
    <div class="max-w-md mx-auto">
      <h1 class="text-2xl font-bold text-neutral-900 mb-6">Connexion</h1>
      <p th:if="${loginError}" class="mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm" th:text="${loginError}"></p>
      <p th:if="${registerSuccess}" class="mb-4 p-3 bg-green-50 text-green-700 rounded-lg text-sm" th:text="${registerSuccess}"></p>
      <form th:action="@{/app/login}" th:object="${loginRequest}" method="post" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-neutral-700 mb-1">Email</label>
          <input type="email" id="email" th:field="*{email}" required
                 class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500"/>
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm mt-1"></p>
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-neutral-700 mb-1">Mot de passe</label>
          <input type="password" id="password" th:field="*{password}" required
                 class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500"/>
          <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-600 text-sm mt-1"></p>
        </div>
        <button type="submit" class="w-full py-2 px-4 bg-brand-600 text-white font-medium rounded-lg hover:bg-brand-700 transition">
          Se connecter
        </button>
      </form>
      <p class="mt-4 text-sm text-neutral-600">
        Pas de compte ? <a th:href="@{/app/register}" class="text-brand-600 hover:text-brand-700 font-medium">S'inscrire</a>
      </p>
    </div>
  </th:block>
</body>
</html>
