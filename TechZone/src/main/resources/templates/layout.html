<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle != null ? pageTitle + ' - TechZone' : 'TechZone'}">TechZone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' },
            neutral: { 50: '#fafafa', 100: '#f5f5f5', 800: '#262626', 900: '#171717' }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 antialiased flex flex-col">
  <header th:replace="~{fragments/header :: header}"></header>
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <div th:if="${message}" class="mb-4 p-4 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-sm" role="alert" th:text="${message}"></div>
    <div th:if="${orderSuccess}" class="mb-4 p-4 rounded-lg bg-green-50 border border-green-200 text-green-800 text-sm" role="status" th:text="${orderSuccess}"></div>
    <th:block th:replace="${content}"></th:block>
  </main>
  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
